---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: visual-qontract
objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: visual-qontract
    name: visual-qontract
    annotations:
      ignore-check.kube-linter.io/minimum-three-replicas: "The internal instance of Visual Qontract does not need 3 replicas"
      ignore-check.kube-linter.io/unset-cpu-requirements: "no cpu limits"
  spec:
    replicas: ${{REPLICAS}}
    selector:
      matchLabels:
        app: visual-qontract
        deployment: visual-qontract
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: visual-qontract
          deployment: visual-qontract
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - visual-qontract
                topologyKey: kubernetes.io/hostname
              weight: 90
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - visual-qontract
                topologyKey: topology.kubernetes.io/zone
              weight: 100
        serviceAccountName: visual-qontract
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - image: ${IMAGE}:${IMAGE_TAG}
          imagePullPolicy: Always
          name: visual-qontract
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
          - name: GRAPHQL_URI
            valueFrom:
              configMapKeyRef:
                  key: graphql.uri
                  name: visual-qontract
          - name: AUTHORIZATION
            valueFrom:
              secretKeyRef:
                  key: authorization
                  name: visual-qontract
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: ${MEMORY_REQUESTS}
              cpu: ${CPU_REQUESTS}
            limits:
              memory: ${MEMORY_LIMIT}
          volumeMounts:
            - name: visual-qontract-env
              mountPath: /opt/visual-qontract/build/env-config.js
              subPath: env-config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-run
              mountPath: /var/run
        volumes:
        - name: visual-qontract-env
          configMap:
            name: visual-qontract
            items:
            - key: env
              path: env-config.js
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
# Canary
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: visual-qontract
    name: visual-qontract-canary
    annotations:
      ignore-check.kube-linter.io/minimum-three-replicas: "The internal instance of Visual Qontract does not need 3 replicas"
      ignore-check.kube-linter.io/unset-cpu-requirements: "no cpu limits"
  spec:
    replicas: ${{REPLICAS_CANARY}}
    selector:
      matchLabels:
        app: visual-qontract
        deployment: visual-qontract
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: visual-qontract
          deployment: visual-qontract
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - visual-qontract
                topologyKey: kubernetes.io/hostname
              weight: 90
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - visual-qontract
                topologyKey: topology.kubernetes.io/zone
              weight: 100
        serviceAccountName: visual-qontract
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - image: ${IMAGE}:${IMAGE_TAG_CANARY}
          imagePullPolicy: Always
          name: visual-qontract
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
          - name: GRAPHQL_URI
            valueFrom:
              configMapKeyRef:
                  key: graphql.uri
                  name: visual-qontract
          - name: AUTHORIZATION
            valueFrom:
              secretKeyRef:
                  key: authorization
                  name: visual-qontract
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: ${MEMORY_REQUESTS}
              cpu: ${CPU_REQUESTS}
            limits:
              memory: ${MEMORY_LIMIT}
          volumeMounts:
            - name: visual-qontract-env
              mountPath: /opt/visual-qontract/build/env-config.js
              subPath: env-config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-run
              mountPath: /var/run
        volumes:
        - name: visual-qontract-env
          configMap:
            name: visual-qontract
            items:
            - key: env
              path: env-config.js
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
- apiVersion: v1
  kind: Service
  metadata:
    name: visual-qontract
    labels:
      app: visual-qontract
  spec:
    type: ClusterIP
    ports:
      - name: https
        port: 443
        targetPort: 8080
        protocol: TCP
    selector:
      deployment: visual-qontract
parameters:
- name: IMAGE
  value: quay.io/app-sre/visual-qontract
  displayName: visual qontract image
  description: visual qontract docker image. Defaults to quay.io/app-sre/visual-qontract
- name: IMAGE_TAG
  required: true
  displayName: visual qontract version
  description: visual qontract version, must be explicitly provided
- name: IMAGE_TAG_CANARY
  required: true
  displayName: visual qontract canary version
  description: visual qontract canary version, must be explicitly provided
- name: MEMORY_REQUESTS
  value: 16Mi
- name: MEMORY_LIMIT
  value: 32Mi
- name: CPU_REQUESTS
  value: 10m
- name: REPLICAS
  value: '3'
- name: REPLICAS_CANARY
  value: '0'
